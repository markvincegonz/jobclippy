services:
  postgres:
    image: postgres:16-alpine
    container_name: jobclippy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jobclippy
    ports:
      - "5433:5432"
    volumes:
      - jobclippy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobclippy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jobclippy_pgdata:
    name: jobclippy_pgdata
